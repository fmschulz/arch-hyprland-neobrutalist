# Submaps for move / resize modes (arrows + hjkl; Esc/Return/Super+key exits)

submap = move
binde = , left, moveactive, -40 0
binde = , right, moveactive, 40 0
binde = , up, moveactive, 0 -40
binde = , down, moveactive, 0 40
binde = , h, moveactive, -40 0
binde = , l, moveactive, 40 0
binde = , k, moveactive, 0 -40
binde = , j, moveactive, 0 40
bind = $mainMod, V, exec, sh -lc 'hyprctl dispatch submap reset && hyprctl notify -1 1000 "rgb(000000)" "Move mode off"'
bind = , return, exec, sh -lc 'hyprctl dispatch submap reset && hyprctl notify -1 1000 "rgb(000000)" "Move mode off"'
bind = , escape, exec, sh -lc 'hyprctl dispatch submap reset && hyprctl notify -1 1000 "rgb(000000)" "Move mode off"'
submap = reset

submap = resize
binde = , left, resizeactive, -40 0
binde = , right, resizeactive, 40 0
binde = , up, resizeactive, 0 -40
binde = , down, resizeactive, 0 40
binde = , h, resizeactive, -40 0
binde = , l, resizeactive, 40 0
binde = , k, resizeactive, 0 -40
binde = , j, resizeactive, 0 40
bind = $mainMod, R, exec, sh -lc 'hyprctl dispatch submap reset && hyprctl notify -1 1000 "rgb(000000)" "Resize mode off"'
bind = , return, exec, sh -lc 'hyprctl dispatch submap reset && hyprctl notify -1 1000 "rgb(000000)" "Resize mode off"'
bind = , escape, exec, sh -lc 'hyprctl dispatch submap reset && hyprctl notify -1 1000 "rgb(000000)" "Resize mode off"'
submap = reset
