# Window rules — Hyprland 0.53+ grammar: `windowrule = <rule> <value>, match:<field> <regex>`
# (the old inline `windowrule = float,^(class)$` / `windowrulev2` forms were removed in 0.53)
# Verify exact class/title strings with `hyprctl clients` if a rule doesn't match.

# Float transient / control dialogs
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor|blueman-manager)$
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1|hyprpolkitagent|polkit-gnome-authentication-agent-1)$
windowrule = float on, match:title ^(Open File.*|Save File.*|Save As.*|Choose Files.*|Choose wallpaper.*)$

# Picture-in-Picture: float, pin above, keep aspect, park bottom-right
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$
windowrule = move 100%-w-30 100%-h-60, match:title ^(Picture-in-Picture)$

# Don't dim/lock during fullscreen video
windowrule = idle_inhibit fullscreen, match:class ^(mpv|firefox|chromium|imv)$

# Scratchpad terminal (matches `kitty --class scratch`)
windowrule = float on, match:class ^(scratch)$
windowrule = size 1100 600, match:class ^(scratch)$
windowrule = center on, match:class ^(scratch)$

# Keybindings cheatsheet (matches `kitty --class keybindings-popup`)
windowrule = float on, match:class ^(keybindings-popup)$
windowrule = size 1000 680, match:class ^(keybindings-popup)$
windowrule = center on, match:class ^(keybindings-popup)$

# Apps shouldn't force-maximize themselves
windowrule = suppress_event maximize, match:class .*
