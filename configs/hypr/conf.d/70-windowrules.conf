# Window rules
windowrule = float on, match:class pavucontrol
windowrule = center on, match:class pavucontrol
windowrule = float on, match:class (blueman-manager|Blueman-manager)
windowrule = center on, match:class (blueman-manager|Blueman-manager)
windowrule = float on, match:class (pinentry-.*)
windowrule = center on, match:class (pinentry-.*)
windowrule = stay_focused on, match:class (pinentry-.*)
windowrule = float on, match:modal true
windowrule = center on, match:modal true
windowrule = float on, match:title ^(Open|Save|Select|Choose|File Upload)(.*)$
windowrule = center on, match:title ^(Open|Save|Select|Choose|File Upload)(.*)$
windowrule = float on, match:title ^Picture-in-Picture$
windowrule = pin on, match:title ^Picture-in-Picture$
windowrule = size 960 540, match:title ^Picture-in-Picture$
windowrule = float on, match:class calendar-popup
windowrule = center on, match:class calendar-popup
windowrule = size 760 640, match:class calendar-popup
windowrule = float on, match:class keybindings-popup
windowrule = center on, match:class keybindings-popup
windowrule = size 900 720, match:class keybindings-popup

# Keep the session awake while any window is fullscreen (video, calls,
# presentations) - idle lock/dpms firing mid-movie is the worst false positive.
windowrule = idle_inhibit fullscreen, match:class .*
