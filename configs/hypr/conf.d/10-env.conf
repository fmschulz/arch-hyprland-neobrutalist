# Environment variables
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice

# Wayland / toolkit
env = GTK_USE_PORTAL,1
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# Note: XDG_SESSION_TYPE is set by the seat/login manager and imported in 20-autostart;
# declaring it here would only affect children and can mask the real value.

# Locale
env = LANG,C.UTF-8
env = LC_TIME,C.UTF-8

# Firefox: native Wayland backend so clipboard works reliably
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1
