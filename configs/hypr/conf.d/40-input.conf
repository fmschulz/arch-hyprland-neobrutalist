# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        scroll_factor = 1.0
        disable_while_typing = true
        middle_button_emulation = false
        clickfinger_behavior = true
        tap-to-click = true
        tap-and-drag = true
        drag_lock = false
    }
}

# Keep Apple Magic Mouse tuning in per-device blocks so the built-in touchpad
# stays on the explicit defaults above.
# Hyprland may expose it under any of these names depending on reconnect order.
device {
    name = magic-mouse
    sensitivity = -0.5
    scroll_method = 2fg
    scroll_factor = 1.0
}

device {
    name = apple-inc.-magic-mouse
    sensitivity = -0.5
    scroll_method = 2fg
    scroll_factor = 1.0
}

device {
    name = apple-inc.-magic-mouse-1
    sensitivity = -0.5
    scroll_method = 2fg
    scroll_factor = 1.0
}

# Gestures (Hyprland 0.45+ syntax)
gestures:workspace_swipe_distance = 300
gestures:workspace_swipe_invert = true
gestures:workspace_swipe_min_speed_to_force = 30
gestures:workspace_swipe_cancel_ratio = 0.5
gestures:workspace_swipe_create_new = true
gestures:workspace_swipe_forever = false
gesture = 3, horizontal, workspace
