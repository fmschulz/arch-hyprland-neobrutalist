# Autostart (exec-once already detaches — no trailing & needed)

# Import session env into systemd/dbus user services
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

# Bar and notifications
exec-once = ~/.config/scripts/ags-shell.sh login
exec-once = mako

# Polkit agent — native Hyprland agent (replaces polkit-gnome)
exec-once = sh -lc 'systemctl --user start hyprpolkitagent.service 2>/dev/null; sleep 0.3; systemctl --user is-active --quiet hyprpolkitagent.service || exec /usr/lib/hyprpolkitagent/hyprpolkitagent'

# Clipboard history (regular clipboard only; the --primary watcher was dropped
# to avoid forking cliphist on every mouse highlight)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# On-screen display server for volume/brightness (no-op until swayosd is installed)
exec-once = sh -lc 'command -v swayosd-server >/dev/null 2>&1 && exec swayosd-server'

# Night light (gamma only; coordinate-free schedule so it never shifts the palette by day)
exec-once = sh -lc 'command -v wlsunset >/dev/null 2>&1 && exec wlsunset -t 3500 -T 6500 -S 07:00 -s 20:00'

# Helpers
exec-once = ~/.config/scripts/bluetooth-autoconnect.sh
exec-once = ~/.config/scripts/clamshell-mode.sh init
# `exec` (not exec-once) runs on every `hyprctl reload`: a reload re-applies
# the local monitor rule and re-enables the panel even with the lid closed —
# no switch event fires, so workspaces drift onto the invisible screen.
exec = ~/.config/scripts/clamshell-mode.sh sync
exec-once = ~/.config/scripts/wallpaper-cycle.sh apply
exec-once = ~/.config/scripts/monitor-hotplug.sh
exec-once = hypridle

# Drop-down scratchpad terminal (lives on a hidden special workspace)
exec-once = [workspace special:scratch silent] kitty --class scratch

# NOTE: nm-applet (NetworkManager tray + secret agent) was removed — the waybar
# network module + wifi-*.sh (nmcli) cover Wi-Fi. If you start using 802.1X / VPN
# networks that need an interactive secret prompt, re-add a NetworkManager agent here.
