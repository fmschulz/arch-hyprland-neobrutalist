# Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE PATH XCURSOR_SIZE XCURSOR_THEME MOZ_ENABLE_WAYLAND MOZ_DBUS_REMOTE GTK_USE_PORTAL LIBVA_DRIVER_NAME AMD_VULKAN_ICD; ~/.config/scripts/waybar-restart.sh
exec-once = mako
exec-once = hypridle
exec-once = command -v hyprsunset >/dev/null 2>&1 && hyprsunset
exec-once = systemctl --user start hyprpolkitagent
# Clipboard only; watching the primary selection would push every mouse
# text-selection into the Super+C history.
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &
exec-once = nm-applet --indicator
exec-once = udiskie --tray --notify
exec-once = ~/.config/scripts/clamshell-mode.sh &
exec-once = ~/.config/scripts/wallpaper-cycle.sh apply
exec-once = sleep 1 && ~/.config/scripts/workspace-rename.sh restore
