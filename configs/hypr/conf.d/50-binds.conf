# Key bindings
bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, ~/.config/scripts/power-menu.sh
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen

# Window sizing shortcuts
bind = $mainMod SHIFT, H, resizeactive, -50% 0
bind = $mainMod SHIFT, V, resizeactive, 0 -50%
bind = $mainMod CTRL, H, resizeactive, 100% 0
bind = $mainMod CTRL, V, resizeactive, 0 100%
bind = $mainMod SHIFT, C, centerwindow
bind = $mainMod, R, exec, sh -lc 'hyprctl dispatch submap resize && hyprctl notify -1 1600 "rgb(8338EC)" "Resize mode: arrows/hjkl resize — Super+R, Esc or Return exits"'

# Groups (tabbed window stacks)
bind = $mainMod, G, togglegroup
bind = $mainMod CTRL, G, changegroupactive, f
bind = $mainMod SHIFT ALT, G, lockactivegroup, toggle

# Application shortcuts
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
# Terminal radio station selector (starts with KALX; edit the local station list)
bind = $mainMod SHIFT, R, exec, $terminal -e ~/.config/scripts/radio.sh

# Keybinding help
bind = $mainMod, slash, exec, ~/.config/scripts/keybindings-popup.sh
bind = $mainMod, F1, exec, ~/.config/scripts/keybindings-popup.sh
# Framework function row defaults to media keys, so Super+F1 arrives as
# Super+XF86AudioMute unless Fn-lock is on. Cover both.
# (No bare-F1 bind: it would steal F1 from every application.)
bind = $mainMod, XF86AudioMute, exec, ~/.config/scripts/keybindings-popup.sh

# Wallpaper cycling
bind = $mainMod, W, exec, ~/.config/scripts/wallpaper-cycle.sh next
bind = $mainMod SHIFT, W, exec, ~/.config/scripts/wallpaper-cycle.sh prev
bind = $mainMod CTRL, W, exec, ~/.config/scripts/wallpaper-cycle.sh random

# Clipboard history
bind = $mainMod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Focus movement
bind = $mainMod ALT, left, movefocus, l
bind = $mainMod ALT, right, movefocus, r
bind = $mainMod ALT, up, movefocus, u
bind = $mainMod ALT, down, movefocus, d

# Swap windows
bind = $mainMod SHIFT ALT, left, swapwindow, l
bind = $mainMod SHIFT ALT, right, swapwindow, r
bind = $mainMod SHIFT ALT, up, swapwindow, u
bind = $mainMod SHIFT ALT, down, swapwindow, d

# Workspace switching
bind = $mainMod, Tab, workspace, previous
bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, left, movetoworkspace, e-1
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod, grave, togglespecialworkspace, scratch
bind = $mainMod SHIFT, grave, movetoworkspacesilent, special:scratch
bind = $mainMod SHIFT, S, movetoworkspace, special

# Workspace overview and renaming
bind = $mainMod, A, exec, ~/.config/scripts/workspace-rename.sh edit $(hyprctl activeworkspace -j | jq -r '.id')
bind = $mainMod SHIFT, A, exec, ~/.config/scripts/workspace-rename.sh overview

# Monitor management
bind = $mainMod, period, movewindow, mon:+1
bind = $mainMod, comma, movewindow, mon:-1
bind = $mainMod SHIFT, period, exec, hyprctl dispatch moveworkspacetomonitor current +1
bind = $mainMod SHIFT, comma, exec, hyprctl dispatch moveworkspacetomonitor current -1
bind = $mainMod CTRL, period, focusmonitor, r
bind = $mainMod CTRL, comma, focusmonitor, l
bind = $mainMod CTRL, M, exec, ~/.config/scripts/monitor-connect.sh

# Notifications
bind = $mainMod CTRL, N, exec, ~/.config/scripts/clear-notifications.sh

# Mouse bindings
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, ~/.config/scripts/screenshot.sh save-area
bind = $mainMod, Print, exec, ~/.config/scripts/screenshot.sh copy-output
bind = $mainMod SHIFT, Print, exec, ~/.config/scripts/screenshot.sh save-area
bind = $mainMod CTRL, Print, exec, ~/.config/scripts/screenshot.sh save-output
# Extra binding for boards missing a Print key (e.g., Keychron)
bind = $mainMod SHIFT, F12, exec, ~/.config/scripts/screenshot.sh save-area
bind = SHIFT, Print, exec, ~/.config/scripts/screenshot.sh save-area
# Area screen recording: select region, press again to stop (~/Documents/screenrecordings)
bind = $mainMod ALT, Print, exec, ~/.config/scripts/screenrecord.sh

# System actions
bind = $mainMod, L, exec, hyprlock
bind = $mainMod ALT, P, exec, wlogout --protocol layer-shell
bind = $mainMod ALT, R, exec, ~/.config/scripts/reload.sh

# Lid switch (clamshell) - event-driven
bindl = , switch:on:Lid Switch, exec, ~/.config/scripts/clamshell-mode.sh closed
bindl = , switch:off:Lid Switch, exec, ~/.config/scripts/clamshell-mode.sh opened

# Media keys
bindel = , XF86AudioRaiseVolume, exec, ~/.config/scripts/volume-control.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/scripts/volume-control.sh down
bindl  = , XF86AudioMute, exec, ~/.config/scripts/volume-control.sh mute
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
