# Keybindings

# --- Window management ---
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, exec, sh -lc 'hyprctl dispatch submap move && hyprctl notify -1 1600 "rgb(06FFA5)" "Move mode: arrows/hjkl move — Super+V, Esc or Return exits"'
bind = $mainMod SHIFT, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen
bind = $mainMod, R, exec, sh -lc 'hyprctl dispatch submap resize && hyprctl notify -1 1600 "rgb(8338EC)" "Resize mode: arrows/hjkl resize — Super+R, Esc or Return exits"'

# --- Window sizing ---
bind = $mainMod SHIFT, H, resizeactive, -50% 0
bind = $mainMod CTRL, H, resizeactive, 100% 0
bind = $mainMod SHIFT, C, centerwindow

# --- Groups (tabbed stacks — conserve screen space on 1280x800) ---
bind = $mainMod, G, togglegroup
bind = $mainMod CTRL, G, changegroupactive, f
bind = $mainMod SHIFT ALT, G, lockactivegroup, toggle

# --- Application shortcuts ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, slash, exec, ~/.config/scripts/keybindings-popup.sh
bind = $mainMod, F1, exec, ~/.config/scripts/keybindings-popup.sh
# Some function rows send Super+XF86AudioMute instead of Super+F1. Cover both.
bind = $mainMod, XF86AudioMute, exec, ~/.config/scripts/keybindings-popup.sh
# Plain F1 also opens the cheatsheet (note: in media-key mode the physical F1
# sends XF86AudioMute = volume mute; use Fn+F1 or Fn-lock for plain F1).
bind = , F1, exec, ~/.config/scripts/keybindings-popup.sh
bind = $mainMod CTRL, I, exec, ~/.config/scripts/wifi-menu.sh
bind = $mainMod CTRL SHIFT, I, exec, ~/.config/scripts/wifi-portal.sh open

# --- Scratchpad terminal ---
bind = $mainMod, grave, togglespecialworkspace, scratch
bind = $mainMod SHIFT, grave, movetoworkspacesilent, special:scratch

# --- Color picker / emoji picker (no-op until hyprpicker / bemoji are installed) ---
bind = $mainMod SHIFT, P, exec, sh -lc 'command -v hyprpicker >/dev/null 2>&1 || exit 0; c=$(hyprpicker -f hex) || exit 0; [ -n "$c" ] || exit 0; printf %s "$c" | wl-copy; notify-send "Color copied" "$c"'
bind = $mainMod, semicolon, exec, sh -lc 'command -v bemoji >/dev/null 2>&1 && exec bemoji -t -n -P "wofi --dmenu --prompt Emoji -c ~/.config/wofi/config -s ~/.config/wofi/style.css"'

# --- Clipboard history (styled wofi) ---
bind = $mainMod, C, exec, sh -lc 'cliphist list | wofi --dmenu -c ~/.config/wofi/config -s ~/.config/wofi/style.css | cliphist decode | wl-copy'

# --- Wallpaper cycling ---
bind = $mainMod, W, exec, ~/.config/scripts/wallpaper-cycle.sh next
bind = $mainMod SHIFT, W, exec, ~/.config/scripts/wallpaper-cycle.sh prev
bind = $mainMod CTRL, W, exec, ~/.config/scripts/wallpaper-cycle.sh random

# --- Desktop theme switching ---
# Retargets the hypr/waybar/wofi/mako/kitty theme symlinks and reloads what
# renders live. Matches fw13.
bind = $mainMod CTRL, T, exec, ~/.config/scripts/theme-set.sh next

# --- Focus movement (Alt + Shift + arrows; plain Alt stays with applications) ---
binde = ALT SHIFT, left, movefocus, l
binde = ALT SHIFT, right, movefocus, r
binde = ALT SHIFT, up, movefocus, u
binde = ALT SHIFT, down, movefocus, d

# --- Window nudging (floating) with repeat ---
binde = $mainMod ALT, left, moveactive, -40 0
binde = $mainMod ALT, right, moveactive, 40 0
binde = $mainMod ALT, up, moveactive, 0 -40
binde = $mainMod ALT, down, moveactive, 0 40

# --- Swap windows ---
binde = $mainMod SHIFT ALT, left, swapwindow, l
binde = $mainMod SHIFT ALT, right, swapwindow, r
binde = $mainMod SHIFT ALT, up, swapwindow, u
binde = $mainMod SHIFT ALT, down, swapwindow, d

# --- Workspace switching ---
bind = $mainMod, Tab, workspace, previous
bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Move window to workspace ---
bind = $mainMod SHIFT, left, movetoworkspace, e-1
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace
# Move-to-special lives on Super+Ctrl+S: Super+Shift+S can be emitted by a
# camera key (and is the Windows snipping combo), and having it swallow
# the focused window made "screenshots" silently vanish Chromium.
bind = $mainMod CTRL, S, movetoworkspace, special

# --- Workspace overview ---
bind = $mainMod SHIFT, up, exec, ~/.config/scripts/workspace-overview.sh

# --- Workspace notes menu (annotated workspaces) ---
bind = $mainMod SHIFT, SPACE, exec, ~/.config/scripts/workspace-notes.sh menu
bind = $mainMod SHIFT, N, exec, ~/.config/scripts/workspace-notes.sh menu

# --- Monitor management ---
bind = $mainMod, period, movewindow, mon:+1
bind = $mainMod, comma, movewindow, mon:-1
bind = $mainMod SHIFT, period, exec, hyprctl dispatch moveworkspacetomonitor current +1
bind = $mainMod SHIFT, comma, exec, hyprctl dispatch moveworkspacetomonitor current -1
bind = $mainMod CTRL, period, focusmonitor, r
bind = $mainMod CTRL, comma, focusmonitor, l
bind = $mainMod CTRL, M, exec, ~/.config/scripts/monitor-connect.sh

# --- Notifications ---
bind = $mainMod CTRL, N, exec, ~/.config/scripts/clear-notifications.sh

# --- Mouse bindings ---
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (grimblast; bare Print saves a region to ~/Documents/screenshots and copies it)
bind = , Print, exec, ~/.config/scripts/screenshot.sh save-area
bind = $mainMod, Print, exec, ~/.config/scripts/screenshot.sh copy-output
bind = $mainMod SHIFT, Print, exec, ~/.config/scripts/screenshot.sh save-area
bind = $mainMod CTRL, Print, exec, ~/.config/scripts/screenshot.sh save-output
# Extra binding for keyboards without a Print key.
bind = $mainMod SHIFT, F12, exec, ~/.config/scripts/screenshot.sh save-area
# Letter-key fallback for keyboards whose Print/F-row keys are hidden by Fn layers.
bind = $mainMod ALT, S, exec, ~/.config/scripts/screenshot.sh save-area
# Some camera keys send Super+Shift+S. Make it a screenshot shortcut.
bind = $mainMod SHIFT, S, exec, ~/.config/scripts/screenshot.sh save-area
# Fallback for keyboards/modes that do not emit Super reliably.
bind = CTRL ALT, S, exec, ~/.config/scripts/screenshot.sh save-area

# --- Screen recording (wf-recorder) — Shift+Print or Super+Shift+R: select region, press again to stop (~/Documents/screenrecordings); Super+R enters resize mode ---
bind = SHIFT, Print, exec, ~/.config/scripts/screenrecord.sh
bind = $mainMod SHIFT, R, exec, ~/.config/scripts/screenrecord.sh

# --- System actions ---
bind = $mainMod, L, exec, ~/.config/scripts/secure-lock.sh
bind = $mainMod ALT, L, exec, ~/.config/scripts/secure-lock.sh
bind = $mainMod ALT, P, exec, ~/.config/scripts/power-menu.sh
bind = $mainMod ALT, R, exec, ~/.config/scripts/reload.sh

# --- Lid switch (clamshell) — event-driven, replaces the old polling daemon ---
bindl = , switch:on:Lid Switch, exec, ~/.config/scripts/clamshell-mode.sh closed
bindl = , switch:off:Lid Switch, exec, ~/.config/scripts/clamshell-mode.sh open

# --- Volume / brightness (routed through swayosd OSD when installed, else fallback) ---
# `if <client>; then exit 0; fi; exec <fallback>` so the fallback still fires when
# swayosd is installed but the server isn't running (exec'ing the client first would
# replace the shell and skip the `||` fallback, leaving the key dead in that case).
bindel = , XF86AudioRaiseVolume, exec, sh -lc 'if command -v swayosd-client >/dev/null 2>&1 && swayosd-client --output-volume raise; then exit 0; fi; exec ~/.config/scripts/volume-control.sh up'
bindel = , XF86AudioLowerVolume, exec, sh -lc 'if command -v swayosd-client >/dev/null 2>&1 && swayosd-client --output-volume lower; then exit 0; fi; exec ~/.config/scripts/volume-control.sh down'
bindl  = , XF86AudioMute, exec, sh -lc 'if command -v swayosd-client >/dev/null 2>&1 && swayosd-client --output-volume mute-toggle; then exit 0; fi; exec ~/.config/scripts/volume-control.sh mute'
bindl  = , XF86AudioMicMute, exec, sh -lc 'if command -v swayosd-client >/dev/null 2>&1 && swayosd-client --input-volume mute-toggle; then exit 0; fi; exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle'
bindel = , XF86MonBrightnessUp, exec, sh -lc 'if command -v swayosd-client >/dev/null 2>&1 && swayosd-client --brightness raise; then exit 0; fi; exec brightnessctl set +5%'
bindel = , XF86MonBrightnessDown, exec, sh -lc 'if command -v swayosd-client >/dev/null 2>&1 && swayosd-client --brightness lower; then exit 0; fi; exec brightnessctl set 5%-'

# --- Media playback (playerctl) ---
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
