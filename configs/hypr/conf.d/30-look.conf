# Look & feel — Neo-Brutalist: sharp corners, thick black borders, no glass.

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 3
    # Active border follows the theme ($themeBorder from ~/.config/hypr/theme.conf);
    # inactive stays black so the focused window still reads at a glance.
    col.active_border = $themeBorder
    col.inactive_border = rgba(000000ff)
    resize_on_border = true
    extend_border_grab_area = 24
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    # Blur disabled: windows are opaque and flat, so blur is invisible and only
    # costs the Intel iGPU shader passes every frame.
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    # borderangle removed: both border colors are solid black, so there's no
    # gradient to animate.
}

dwindle {
    # pseudotile option removed in Hyprland 0.55 — use the `pseudo` dispatcher (Super+P).
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # vfr (variable frame rate) is automatic since Hyprland 0.55 — the option was removed.
    vrr = 2           # fullscreen-only VRR
}
