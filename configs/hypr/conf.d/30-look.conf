# General settings
general {
    gaps_in = 8
    gaps_out = 16
    # 4px border: on-theme (thick brutalist lines) and a bigger drag target
    # for resize_on_border. Note: extend_border_grab_area only applies to
    # floating windows (hyprwm/Hyprland#2885); tiled windows are grabbed on
    # the border/gap itself, so Super+RightDrag is the reliable tiled resize.
    border_size = 4
    col.active_border = rgba(FFBE0Bff)
    col.inactive_border = rgba(000000ff)
    resize_on_border = true
    extend_border_grab_area = 32
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

# Decoration
decoration {
    rounding = 0

    # Blur disabled: windows are flat and (except Kitty's deliberate 0.7
    # translucency, which stays unblurred) opaque, so blur would only cost
    # the AMD iGPU shader passes every frame.
    blur {
        enabled = false
    }
}

# Animations
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    # borderangle removed: both border colors are solid, so there's no
    # gradient to animate.
}

# Dwindle layout
dwindle {
    preserve_split = true
}

# Master layout
master {
    new_status = master
}

# Groups (tabbed window stacks) - themed to match the window borders
group {
    col.border_active = rgba(FFBE0Bff)
    col.border_inactive = rgba(000000ff)

    groupbar {
        font_family = JetBrains Mono Nerd Font
        col.active = rgba(FFBE0Bff)
        col.inactive = rgba(FFFFFFff)
        text_color = rgba(000000ff)
        rounding = 0
    }
}

# Misc
misc {
    disable_hyprland_logo = true
    # VFR is enabled by default in Hyprland 0.55; misc:vfr was removed.
    vrr = 1                       # Variable refresh rate if monitor supports
}
