# Hyprlock Configuration
# Neo-Brutalist Lock Screen

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
}

# Password unlock only.

background {
    monitor =
    path = ~/.cache/wallpaper-cycle/current
    # No blur: keep the flat, sharp brutalist look.
    blur_passes = 0
}

input-field {
    monitor =
    size = 220, 56
    position = 0, -80
    dots_center = true
    fade_on_empty = false
    font_color = rgb(000000)
    inner_color = rgb(FFBE0B)
    outer_color = rgb(000000)
    outline_thickness = 4
    check_color = rgb(06FFA5)
    fail_color = rgb(FF006E)
    fail_text = <b>WRONG</b> (<i>$ATTEMPTS</i>)
    capslock_color = rgb(FB5607)
    numlock_color = rgb(8338EC)
    placeholder_text = <i>Input Password...</i>
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(000000)
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(000000)
    font_size = 55
    font_family = JetBrains Mono Nerd Font
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $USER
    color = rgb(000000)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

# Battery percentage when a laptop battery is present.
label {
    monitor =
    text = cmd[update:30000] sh -c 'set -- /sys/class/power_supply/BAT*/capacity; [ -r "$1" ] && printf "BAT %s%%" "$(cat "$1")"'
    color = rgb(000000)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, -160
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
}
