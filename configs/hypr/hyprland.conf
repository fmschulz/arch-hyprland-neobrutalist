# Hyprland Configuration — Neo-Brutalist
# Modular config: sections live in ~/.config/hypr/conf.d/ and are sourced below.
# Variables are defined here first so every sourced file can use them.

# Programs / variables
$mainMod = SUPER
$terminal = kitty
$fileManager = kitty -e yazi
$menu = sh -lc 'pkill -x wofi || exec wofi -c ~/.config/wofi/config -s ~/.config/wofi/style.css'

# Theme colors ($themeAccent, $themeAccentText, $themeBorder). The symlink is
# maintained by theme-set.sh (Super+Ctrl+T cycles themes). Sourced before
# conf.d/ so 30-look.conf can use the variables.
source = ~/.config/hypr/theme.conf

# Sections (order matters: monitors/env/look before binds; submaps after binds)
source = ~/.config/hypr/conf.d/00-monitors.conf
source = ~/.config/hypr/conf.d/10-env.conf
source = ~/.config/hypr/conf.d/20-autostart.conf
source = ~/.config/hypr/conf.d/30-look.conf
source = ~/.config/hypr/conf.d/40-input.conf
source = ~/.config/hypr/conf.d/50-binds.conf
source = ~/.config/hypr/conf.d/60-submaps.conf
source = ~/.config/hypr/conf.d/70-windowrules.conf
