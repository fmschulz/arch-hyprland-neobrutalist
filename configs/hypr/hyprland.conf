# Hyprland Configuration — Neo-Brutalist
# Modular config: sections live in ~/.config/hypr/conf.d/ and are sourced below.
# Variables are defined here first so every sourced file can use them.

# Programs / variables
$mainMod = SUPER
$terminal = kitty
$fileManager = kitty -e yazi
$menu = wofi -c ~/.config/wofi/config -s ~/.config/wofi/style.css

# Monitors are intentionally machine-local. This file is installed once from
# configs/hypr/monitors.conf.example and is preserved across `make apply`.
# Edit ~/.config/hypr/monitors.conf for your displays; do not edit this file.
source = ~/.config/hypr/monitors.conf

# Sections (order matters: env/look before binds; submaps after binds)
source = ~/.config/hypr/conf.d/10-env.conf
source = ~/.config/hypr/conf.d/20-autostart.conf
source = ~/.config/hypr/conf.d/30-look.conf
source = ~/.config/hypr/conf.d/40-input.conf
source = ~/.config/hypr/conf.d/50-binds.conf
source = ~/.config/hypr/conf.d/60-submaps.conf
source = ~/.config/hypr/conf.d/70-windowrules.conf

# Hyprland permission prompts. These rules require a Hyprland restart to change.
ecosystem:enforce_permissions = true
permission = /usr/bin/grim, screencopy, allow
permission = /usr/bin/grimblast, screencopy, allow
permission = /usr/bin/hyprpicker, screencopy, allow
permission = /usr/bin/wf-recorder, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
