general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd chromeos::kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd chromeos::kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                        # 5min
    on-timeout = ~/.config/scripts/idle-lock.sh          # lock on idle; skipped while an external monitor is attached (docked)
}

listener {
    timeout = 360                                 # 6min: screen off shortly after lock
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
