general {
    lock_cmd = ~/.config/scripts/secure-lock.sh # clear clipboard history before locking.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # dim to a comfort floor (avoid full 0).
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = ~/.config/scripts/idle-suspend.sh   # suspend only on battery; on AC keep SSH sessions alive (re-checks until activity)
    on-resume = pkill -f idle-suspend.sh             # user is back: stop the AC re-check loop
}
